<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Have a question, a project idea, or just want to say hi? Contact Bepsi.">
    <meta name="author" content="Bepsi">
    <meta property="og:title" content="Contact Me - Bepsi">
    <meta property="og:description" content="Have a question, a project idea, or just want to say hi? Contact Bepsi.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://placehold.co/1200x630/18181b/FFFFFF?text=Contact+Bepsi">
    <title>Contact Me - Bepsi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="preload" href="header.html" as="fetch" crossorigin>
    <link rel="preload" href="footer.html" as="fetch" crossorigin>
    <link rel="icon" type="image/png" href="images/website-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-blue-500 selection:text-white">
    <div class="scanlines"></div>
    
    <!-- Background Layer System -->
    <div class="bg-grid-pattern"></div>
    <div class="glow-blob bg-blue-500/10 w-[600px] h-[600px] -top-40 -left-40"></div>
    <div class="glow-blob bg-indigo-500/8 w-[500px] h-[500px] top-1/2 right-10"></div>
    <div class="glow-blob bg-purple-500/10 w-[600px] h-[600px] bottom-10 left-10"></div>

    <div id="header-placeholder"></div>

    <main id="main-content" class="relative z-10 pt-36 pb-24">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-6xl mx-auto items-start">
                
                <!-- Contact Form Container with Validation & States -->
                <div class="soft-card glow-card p-8 md:p-10" data-aos="fade-right">
                    <span class="text-blue-500 font-bold text-xs tracking-wider uppercase mb-2 block">Communication</span>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 leading-none">
                        Let's <span class="text-gradient-cyan-indigo">Talk</span>
                    </h1>
                    <p class="text-gray-400 text-base md:text-lg mb-8 font-medium leading-relaxed">
                        Have a question, a hardware project, or just want to collaborate?
                    </p>
                    
                    <!-- Main Form (Feature 14 UTM auto-injected, Feature 16 Error States) -->
                    <form id="contact-form" action="https://formspree.io/f/xldnazyg" method="POST" data-validate="true" class="space-y-5">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div class="form-group">
                                <label for="form-name" class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Full Name <span class="text-red-400">*</span></label>
                                <input type="text" id="form-name" name="name" required placeholder="John Doe" class="w-full">
                            </div>
                            <div class="form-group">
                                <label for="form-email" class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Email Address <span class="text-red-400">*</span></label>
                                <input type="email" id="form-email" name="email" required placeholder="john@example.com" class="w-full">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="form-subject" class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Subject <span class="text-red-400">*</span></label>
                            <input type="text" id="form-subject" name="subject" required minlength="3" placeholder="What's this regarding?" class="w-full">
                        </div>

                        <div class="form-group">
                            <label for="form-message" class="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Message <span class="text-red-400">*</span></label>
                            <textarea id="form-message" name="message" rows="5" required minlength="10" placeholder="Type your message here..." class="w-full"></textarea>
                        </div>

                        <div class="pt-2">
                            <button type="submit" class="btn-navy w-full justify-center py-3 text-base">
                                Send Message
                            </button>
                        </div>
                    </form>

                    <!-- Form Success State Card -->
                    <div id="contact-form-success" class="form-success-card soft-card">
                        <div class="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-2">Message Dispatched!</h3>
                        <p class="text-gray-400 text-sm max-w-md mx-auto mb-6">
                            Thank you for reaching out. Your message has been sent. I will respond as soon as possible.
                        </p>
                        <button type="button" data-form-reset="contact-form" class="btn-outline text-xs py-2 px-6">
                            Send Another Message
                        </button>
                    </div>
                </div>

                <!-- Right Side: Direct Contacts -->
                <div class="space-y-6 flex flex-col justify-start" data-aos="fade-left" data-aos-delay="200">
                    
                    <!-- Direct Contact Methods -->
                    <div class="grid grid-cols-1 gap-4">
                        <!-- Discord Direct Card -->
                        <div class="soft-card glow-card float-card p-6 w-full text-left group hover:border-blue-500/30">
                            <div class="float-content">
                                <div class="text-[#5865f2] mb-3 group-hover:scale-105 transition-transform duration-300">
                                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
                                    </svg>
                                </div>
                                <h3 class="text-base font-bold text-white mb-0.5">Discord</h3>
                                <p class="text-gray-400 text-xs font-mono">theukgovernment</p>
                            </div>
                        </div>

                        <!-- Email Card -->
                        <a href="mailto:sandra@blowyournanstitscleanoff.shop" class="soft-card glow-card float-card p-6 w-full group hover:border-blue-500/30">
                            <div class="float-content">
                                <div class="text-[#10b981] mb-3 group-hover:scale-105 transition-transform duration-300">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-base font-bold text-white mb-0.5">Email</h3>
                                <p class="text-gray-400 text-xs truncate font-mono">sandra@blowyournanstitscleanoff.shop</p>
                            </div>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="main.js"></script>
</body>
</html>
