<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Bepsi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="preload" href="header.html" as="fetch" crossorigin>
    <link rel="preload" href="footer.html" as="fetch" crossorigin>
    <link rel="icon" type="image/png" href="images/website-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-blue-500 selection:text-white bg-[#08090d] text-slate-200 min-h-screen">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-grid-pattern"></div>

    <div id="header-placeholder"></div>

    <main id="main-content" class="relative z-10 pt-40 pb-28 min-h-[75vh] flex flex-col justify-center items-center text-center">
        <div class="container mx-auto px-6 max-w-2xl" data-aos="fade-up">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-rose-500/20 bg-rose-500/10 text-rose-400 font-mono text-xs tracking-wider uppercase mb-6">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
                STATUS 404 // NULL ROUTE
            </div>
            
            <h1 class="text-6xl sm:text-7xl md:text-8xl font-bold font-mono text-white mb-4 tracking-tight leading-none">
                Error <span class="text-rose-400">404</span>
            </h1>
            <h2 class="text-2xl sm:text-3xl font-bold font-['Space_Grotesk'] text-white mb-4">
                Dead Socket.
            </h2>
            
            <p class="text-slate-400 text-base sm:text-lg mb-8 leading-relaxed font-normal">
                Looks like the page you are trying to visit has been unplugged or doesn't exist. Let's redirect that bandwidth back to safety.
            </p>

            <div class="p-4 rounded-xl bg-[#10121a] border border-white/[0.08] font-mono text-xs text-slate-400 max-w-md mx-auto mb-8 space-y-1 text-left">
                <div class="flex items-center justify-between text-slate-500">
                    <span>[DIAGNOSTIC]</span>
                    <span>TIMESTAMP: <script>document.write(new Date().toISOString().slice(0, 10))</script></span>
                </div>
                <div>ROUTE: <span class="text-rose-400">UNRESOLVED_URI</span></div>
                <div>STATUS: <span class="text-slate-300">0x00000194 // SOCKET_CLOSED</span></div>
            </div>

            <div class="flex flex-wrap justify-center gap-4">
                <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-mono text-xs font-semibold uppercase tracking-wider transition-all shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Return Home
                </a>
                <button type="button" data-search-trigger class="inline-flex items-center gap-2 px-6 py-3 rounded-xl border border-white/10 bg-[#12141d] hover:bg-[#1a1d2b] text-slate-300 hover:text-white font-mono text-xs font-semibold uppercase tracking-wider transition-all">
                    <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    Search Site (Ctrl+K)
                </button>
            </div>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>

    <script src="background-animation.js" defer></script>
    <script src="main.js"></script>
</body>
</html>
