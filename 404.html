<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Bepsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="selection:bg-blue-500 selection:text-white">
    <div class="scanlines"></div>
    
    <!-- Background Layer System -->
    <div class="bg-grid-pattern"></div>
    <div class="glow-blob bg-blue-500/10 w-[600px] h-[600px] -top-40 -left-40"></div>
    <div class="glow-blob bg-indigo-500/8 w-[500px] h-[500px] top-1/2 right-10"></div>
    <div class="glow-blob bg-purple-500/10 w-[600px] h-[600px] bottom-10 left-10"></div>

    <div id="header-placeholder"></div>

    <main class="relative z-10 pt-40 pb-20 min-h-[70vh] flex flex-col justify-center items-center text-center">
        <div class="container mx-auto px-6" data-aos="fade-up">
            <h1 class="text-7xl md:text-8xl font-extrabold text-blue-400 mb-6 font-mono leading-none tracking-tight">
                Error <span class="text-gradient-cyan-indigo">404</span>
            </h1>
            <h2 class="text-3xl font-extrabold text-white mb-4">Dead Socket.</h2>
            <div class="max-w-xl mx-auto text-lg text-gray-400 mb-10 leading-relaxed font-medium">
                <p>
                    Looks like the page you are trying to visit has been unplugged or doesn't exist. Let's redirect that bandwidth back to safety.
                </p>
            </div>
            <a href="/" class="btn-navy py-3 px-8 text-base">
                Return Home
            </a>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>

    <script src="/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const initPage = () => {
                if (typeof AOS !== 'undefined') {
                    AOS.init({
                        duration: 900,
                        once: true,
                        offset: 40,
                        easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
                    });
                }
            };

            const loadComponents = async () => {
                try {
                    // Use absolute paths for 404 since it might be triggered from any subdirectory like /reviews/something
                    const [headerResponse, footerResponse] = await Promise.all([
                        fetch('/header.html'),
                        fetch('/footer.html')
                    ]);

                    if (!headerResponse.ok) throw new Error('Failed to fetch header');
                    if (!footerResponse.ok) throw new Error('Failed to fetch footer');

                    const headerData = await headerResponse.text();
                    const footerData = await footerResponse.text();

                    document.getElementById('header-placeholder').innerHTML = headerData;
                    document.getElementById('footer-placeholder').innerHTML = footerData;

                    // Initialize main features once components are in DOM
                    if (typeof initializeUI === 'function') initializeUI();
                    if (typeof initNavbarScroll === 'function') initNavbarScroll();
                    if (typeof initGlowCards === 'function') initGlowCards();
                    if (typeof initFloatCards === 'function') initFloatCards();

                    initPage();
                } catch (error) {
                    console.error('Error loading components:', error);
                    initPage();
                }
            };

            loadComponents();
        });
    </script>
</body>
</html>
