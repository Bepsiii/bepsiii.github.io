<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Bepsi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="preload" href="/header.html" as="fetch" crossorigin>
    <link rel="preload" href="/footer.html" as="fetch" crossorigin>
    <link rel="icon" type="image/png" href="/images/website-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="selection:bg-blue-500 selection:text-white">
    <div class="scanlines"></div>
    
    <!-- Background Layer System -->
    <div class="bg-grid-pattern"></div>
    <div class="glow-blob bg-blue-500/10 w-[600px] h-[600px] -top-40 -left-40"></div>
    <div class="glow-blob bg-indigo-500/8 w-[500px] h-[500px] top-1/2 right-10"></div>
    <div class="glow-blob bg-purple-500/10 w-[600px] h-[600px] bottom-10 left-10"></div>

    <div id="header-placeholder"></div>

    <main id="main-content" class="relative z-10 pt-40 pb-20 min-h-[70vh] flex flex-col justify-center items-center text-center">
        <div class="container mx-auto px-6" data-aos="fade-up">
            <h1 class="text-7xl md:text-8xl font-extrabold text-blue-400 mb-6 font-mono leading-none tracking-tight">
                Error <span class="text-gradient-cyan-indigo">404</span>
            </h1>
            <h2 class="text-3xl font-extrabold text-white mb-4">Dead Socket.</h2>
            <div class="max-w-xl mx-auto text-lg text-gray-400 mb-10 leading-relaxed font-medium">
                <p>
                    Looks like the page you are trying to visit has been unplugged or doesn't exist. Let's redirect that bandwidth back to safety.
                </p>
            </div>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="/index.html" class="btn-navy py-3 px-8 text-base">
                    Return Home
                </a>
                <button type="button" data-search-trigger class="btn-outline py-3 px-6 text-sm">
                    Search Site
                </button>
            </div>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>

    <script src="/main.js"></script>
</body>
</html>
